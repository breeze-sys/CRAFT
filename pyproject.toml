[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-grid"
version = "0.1.0"
description = "Consequence-aware risk-adaptive framework for trusted execution of AI-driven power grid agents."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "CRAFT Team" }
]
dependencies = [
  "fastapi>=0.115,<1",
  "gmssl>=3.2,<4",
  "grid2op>=1.10,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "scipy>=1.11,<2",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1"
]
grid-accelerated = [
  "lightsim2grid>=0.9,<1"
]

[project.scripts]
craft-env-check = "craft.environment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
packages = ["craft"]
strict = true
warn_unused_ignores = true
warn_return_any = true

